name: Windows Gamer

on:
  workflow_dispatch:

jobs:
  gamer:
    runs-on: windows-latest
    timeout-minutes: 300

    steps:

      - name: Criar usuario gamer
        shell: powershell
        run: |
          Write-Host "Configurando usuario..."

          $policy = "C:\security.cfg"

          secedit /export /cfg $policy | Out-Null

          (Get-Content $policy) `
            -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' `
            -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 6' |
            Set-Content $policy

          secedit /configure `
            /db C:\Windows\Security\Database\security.sdb `
            /cfg $policy `
            /areas SECURITYPOLICY | Out-Null

          Start-Sleep -Seconds 2

          $old = Get-LocalUser -Name "gamer" -ErrorAction SilentlyContinue

          if ($old) {
              Remove-LocalUser -Name "gamer"
          }

          $password = ConvertTo-SecureString "Gamer2026" -AsPlainText -Force

          New-LocalUser `
            -Name "gamer" `
            -Password $password `
            -FullName "Gamer" `
            -Description "Gaming User" `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "gamer"

          Write-Host "Usuario gamer criado."

      - name: Ativar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP ativado."

      - name: Ativar audio
        shell: powershell
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic
          Set-Service -Name AudioEndpointBuilder -StartupType Automatic

          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue

          Write-Host "Audio ativado."

      - name: Instalar ZeroTier
        shell: powershell
        run: |
          Write-Host "Baixando ZeroTier..."

          $url = "https://download.zerotier.com/dist/ZeroTier%20One.msi"
          $installer = "$env:TEMP\ZeroTierOne.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Write-Host "Instalando ZeroTier..."

          $process = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
              Write-Error "Falha na instalacao do ZeroTier. Codigo: $($process.ExitCode)"
              exit 1
          }

          Start-Service ZeroTierOneService -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host "ZeroTier instalado."

      - name: Entrar na rede ZeroTier
        shell: powershell
        env:
          ZT_NETWORK_ID: "2873fd00f22af346"
        run: |
          if ($env:ZT_NETWORK_ID -notmatch '^[0-9a-fA-F]{16}$') {
              Write-Error "Network ID invalido."
              exit 1
          }

          $zt = "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat"

          if (!(Test-Path $zt)) {
              $zt = "C:\Program Files\ZeroTier\One\zerotier-cli.bat"
          }

          if (!(Test-Path $zt)) {
              Write-Error "zerotier-cli nao foi encontrado."
              exit 1
          }

          Write-Host "Entrando na rede ZeroTier..."

          & $zt join $env:ZT_NETWORK_ID

          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "STATUS DO ZEROTIER:"
          & $zt status

          Write-Host ""
          Write-Host "REDES:"
          & $zt listnetworks

          Write-Host ""
          Write-Host "NODE ID:"
          & $zt info

          Write-Host ""
          Write-Host "IP DA REDE:"
          & $zt get $env:ZT_NETWORK_ID ip4

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       WINDOWS GAMER ONLINE"
          Write-Host "========================================"
          Write-Host "USUARIO: gamer"
          Write-Host "SENHA:   Gamer2026"
          Write-Host "NETWORK ID: 2873fd00f22af346"
          Write-Host "========================================"

      - name: Manter maquina ligada
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "MAQUINA ATIVA"
          Write-Host "ZeroTier conectado."
          Write-Host "Nao encerre este workflow."
          Write-Host "========================================"

          while ($true) {
              Start-Sleep -Seconds 30
          }
