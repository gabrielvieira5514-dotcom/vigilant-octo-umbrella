name: Free Moonlight Gamer - Sunshine Manual

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Criar usuario gamer
        shell: powershell
        run: |
          $user = "gamer"
          $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"
          $password = -join (1..16 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })

          net user $user $password /add
          net localgroup Administrators $user /add

          "GAMER_USER=$user" | Out-File $env:GITHUB_ENV -Append
          "GAMER_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

      - name: Habilitar RDP
        shell: powershell
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Mostrar dados da sessao
        shell: powershell
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -notlike "127.*" -and
              $_.IPAddress -notlike "169.254.*" -and
              $_.InterfaceAlias -notlike "*Loopback*"
            } |
            Select-Object -First 1 -ExpandProperty IPAddress)

          Write-Host ""
          Write-Host "========================================"
          Write-Host " WINDOWS GAMER"
          Write-Host "========================================"
          Write-Host "USUARIO: $env:GAMER_USER"
          Write-Host "SENHA:   $env:GAMER_PASSWORD"
          Write-Host "IP LOCAL DO RUNNER: $ip"
          Write-Host "RDP: $ip`:3389"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "SUNSHINE NAO FOI INSTALADO AUTOMATICAMENTE."
          Write-Host "Instale o Sunshine MANUALMENTE dentro do Windows."
          Write-Host "Depois abra o Sunshine e configure o PIN pelo Moonlight."
          Write-Host ""

      - name: Manter o Windows ligado
        shell: powershell
        run: |
          Write-Host "Workflow ativo. Instale/configure o Sunshine manualmente agora."
          while ($true) {
            Start-Sleep -Seconds 30
          }
          
