name: Free Moonlight Gamer (sem Secret do Tailscale)

on:
  workflow_dispatch:

jobs:
  gaming-host:
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Criar usuário gamer
        shell: pwsh
        run: |
          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*'
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $bytes = New-Object byte[] 18
          $rng.GetBytes($bytes)
          $password = -join ($bytes | ForEach-Object { $chars[$_ % $chars.Length] })
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "gamer" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "gamer" -Password $secure -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword
          } else {
            Set-LocalUser -Name "gamer" -Password $secure
          }

          Add-LocalGroupMember -Group "Administrators" -Member "gamer" -ErrorAction SilentlyContinue
          "GAMER_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

      - name: Ativar RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Instalar Tailscale (sem AuthKey)
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            throw "Tailscale não foi instalado corretamente."
          }

          # Sem Secret: inicia o login interativo e captura a URL exibida pelo Tailscale.
          $log = "$env:TEMP\tailscale-login.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $args = 'up --unattended=true --hostname="github-gamer-' + $env:GITHUB_RUN_ID + '"'
          $p = Start-Process -FilePath $ts -ArgumentList $args -RedirectStandardOutput $log -RedirectStandardError $log -PassThru -WindowStyle Hidden

          Write-Host ""
          Write-Host "=============================================================="
          Write-Host "LOGIN DO TAILSCALE - NÃO PRECISA DE SECRET"
          Write-Host "Abra a URL abaixo no navegador do celular e faça login."
          Write-Host "=============================================================="

          $loginUrl = $null
          for ($i = 0; $i -lt 60 -and -not $loginUrl; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $log) {
              $text = Get-Content $log -Raw -ErrorAction SilentlyContinue
              $m = [regex]::Match($text, 'https://login\.tailscale\.com[^\s\r\n]+')
              if ($m.Success) { $loginUrl = $m.Value.TrimEnd('.') }
            }
          }

          if ($loginUrl) {
            Write-Host "URL PARA LOGIN: $loginUrl"
          } else {
            Write-Host "Saída do Tailscale:"
            if (Test-Path $log) { Get-Content $log }
            throw "O Tailscale não forneceu a URL de login dentro do tempo esperado."
          }

          Write-Host ""
          Write-Host "Depois de autorizar o dispositivo, o workflow continuará sozinho."
          Write-Host "Aguardando o IP 100.x.x.x..."

          $ip = $null
          for ($i = 0; $i -lt 180 -and -not $ip; $i++) {
            Start-Sleep -Seconds 2
            try {
              $candidate = (& $ts ip -4 2>$null | Select-Object -First 1).Trim()
              if ($candidate -match '^100\.') { $ip = $candidate }
            } catch {}
          }

          if (-not $ip) {
            Write-Host "Saída do Tailscale:"
            if (Test-Path $log) { Get-Content $log }
            throw "Não consegui obter o IP Tailscale. Confirme o login/autorização."
          }

          "TAILSCALE_IP=$ip" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Tailscale conectado: $ip"

      - name: Instalar Sunshine (MSI)
        shell: pwsh
        run: |
          # Desde o Sunshine 2026.906, o instalador EXE/NSIS foi descontinuado.
          # Usamos o MSI oficial para Windows AMD64.
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/LizardByte/Sunshine/releases/latest" -Headers @{ "User-Agent" = "GitHub-Actions" }
          $asset = $release.assets | Where-Object { $_.name -eq "Sunshine-Windows-AMD64-installer.msi" } | Select-Object -First 1
          if (-not $asset) { throw "Não encontrei o Sunshine-Windows-AMD64-installer.msi na release oficial." }

          $installer = "$env:TEMP\Sunshine-Windows-AMD64-installer.msi"
          Write-Host "Baixando Sunshine: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer -UseBasicParsing

          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 1000000) {
            throw "O download do instalador do Sunshine parece incompleto."
          }

          Write-Host "Instalando Sunshine via MSI..."
          $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -PassThru
          if ($proc.ExitCode -notin @(0, 3010)) {
            throw "Instalação do Sunshine falhou. Código MSI: $($proc.ExitCode)"
          }

          # Garante que o serviço exista e esteja iniciado.
          $svc = Get-Service | Where-Object { $_.Name -match 'Sunshine' -or $_.DisplayName -match 'Sunshine' } | Select-Object -First 1
          if ($svc) {
            if ($svc.Status -ne 'Running') { Start-Service -Name $svc.Name -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 5
            Write-Host "Serviço Sunshine: $((Get-Service -Name $svc.Name).Status)"
          } else {
            Write-Host "Aviso: serviço Sunshine não foi localizado imediatamente; verificando processo..."
          }

          $sunshine = Get-ChildItem "$env:ProgramFiles\Sunshine" -Filter "sunshine.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sunshine) { $sunshine = Get-ChildItem "$env:ProgramFiles\LizardByte\Sunshine" -Filter "sunshine.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($sunshine) { Write-Host "Sunshine instalado em: $($sunshine.FullName)" }

      - name: Abrir portas do Sunshine
        shell: pwsh
        run: |
          foreach ($p in @(47984,47989,47990,48010)) {
            New-NetFirewallRule -DisplayName "Sunshine TCP $p" -Direction Inbound -Protocol TCP -LocalPort $p -Action Allow -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName "Sunshine UDP $p" -Direction Inbound -Protocol UDP -LocalPort $p -Action Allow -ErrorAction SilentlyContinue
          }

      - name: Mostrar dados para Moonlight
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================================================"
          Write-Host "       WINDOWS GAMER - SESSÃO TEMPORÁRIA"
          Write-Host "================================================"
          Write-Host "USUÁRIO: gamer"
          Write-Host "SENHA:   $env:GAMER_PASSWORD"
          Write-Host "IP:      $env:TAILSCALE_IP"
          Write-Host "RDP:     $env:TAILSCALE_IP`:3389"
          Write-Host "SUNSHINE: https://$env:TAILSCALE_IP`:47990"
          Write-Host "================================================"
          Write-Host "No Moonlight, adicione o IP acima."
          Write-Host "O PIN é gerado pelo Moonlight e digitado no Sunshine."
          Write-Host "================================================"
          Write-Host "ATENÇÃO: runner temporário; não é uma GPU gamer dedicada."
          Write-Host "================================================"
          Write-Host ""

      - name: Manter sessão ativa
        shell: pwsh
        run: |
          Write-Host "Sessão ativa. Não feche este workflow."
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "$(Get-Date -Format 'HH:mm:ss') - Windows ativo - IP: $env:TAILSCALE_IP"
          }
          
