name: Free Moonlight Gamer - Sunshine Manual

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Criar usuario gamer
        shell: powershell
        run: |
          $user = "gamer"

          # Senha com no maximo 14 caracteres
          $password = "Gamer@2026X9"

          # Remove o usuario se ele ja existir
          net user $user /delete 2>$null

          # Cria o usuario
          net user $user $password /add

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Nao foi possivel criar o usuario gamer."
            exit 1
          }

          # Coloca gamer como administrador
          net localgroup Administrators $user /add

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Nao foi possivel adicionar gamer aos Administrators."
            exit 1
          }

          "GAMER_USER=$user" | Out-File $env:GITHUB_ENV -Append
          "GAMER_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Usuario gamer criado com sucesso."

      - name: Habilitar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP habilitado."

      - name: Mostrar dados da sessao
        shell: powershell
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -notlike "127.*" -and
              $_.IPAddress -notlike "169.254.*" -and
              $_.InterfaceAlias -notlike "*Loopback*"
            } |
            Select-Object -First 1 -ExpandProperty IPAddress)

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        WINDOWS GAMER"
          Write-Host "========================================"
          Write-Host "USUARIO: $env:GAMER_USER"
          Write-Host "SENHA:   $env:GAMER_PASSWORD"
          Write-Host "IP:      $ip"
          Write-Host "RDP:     $ip`:3389"
          Write-Host "========================================"
          Write-Host ""

      - name: Manter o Windows ligado
        shell: powershell
        run: |
          Write-Host "Windows Gamer ativo."
          Write-Host "Usuario: gamer"

          while ($true) {
            Start-Sleep -Seconds 30
          }
